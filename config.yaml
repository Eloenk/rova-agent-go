# Rova AI & Engine Configuration

execution:
  # Circle custody is the fail-safe default. Direct signing must be selected explicitly.
  mode: "circle"

ai:
  # Provider options:
  #   "gemini"    - Primary Google Generative AI (Requires GOOGLE_GENERATIVE_AI_API_KEY)
  #   "anthropic" - Primary Anthropic Claude (Requires ANTHROPIC_API_KEY)
  #   "nvidia"    - NVIDIA NIM AI Router (https://integrate.api.nvidia.com/, Requires NVIDIA_API_KEY)
  #   "regex"     - Direct 0ms Local Deterministic Pattern Matching Failsafe Parser
  #   "auto"      - Failover: Anthropic -> Gemini -> NVIDIA
  provider: "regex"

  # Model names (leave blank for automatic provider defaults):
  #   Gemini options:    "gemini-2.0-flash", "gemini-1.5-pro"
  #   Anthropic options: "claude-3-5-sonnet-20240620"
  #   NVIDIA options:    "z-ai/glm-5.2", "meta/llama-3.1-405b-instruct"
  model: "z-ai/glm-5.2"

  # Fallback controls:
  #   Set allow_regex_fallback to true to enable local regex intent parsing when AI APIs are rate-limited.
  #   Set to false to force PURE AI AGENT parsing ONLY.
  allow_regex_fallback: false

  # Generation settings
  temperature: 0.1
  max_tokens: 8192

database:
  # REST uses the server-only secret key. Realtime requires a separate publishable
  # key plus narrowly scoped RLS policies; otherwise the engine uses REST polling.
  supabase_enabled: true

app:
  url: "https://rovapay.xyz"

vault:
  # Fund-moving vault execution is outside this mainnet release.
  strategy: "disabled"
  address: ""

balance:
  # Balance monitoring mode:
  #   "wss" - Real-time push WebSocket log subscription (Transfer events)
  #   "rpc" - Polling via JSON-RPC with multi-endpoint failover
  mode: "wss"
  poll_interval_sec: 180

arc:
  rpc_url: "https://rpc.mainnet.arc.io"
  rpc_urls:
    - "https://rpc.mainnet.arc.io"
    - "https://rpc.drpc.mainnet.arc.io"
  wss_urls:
    - "wss://rpc.mainnet.arc.io"
    - "wss://rpc.drpc.mainnet.arc.io"
  chain_id: 5042
  # Populate only after the owner deploys RovaExecutionLog and verifies the address.
  execution_log_address: ""
  usdc_address: "0x3600000000000000000000000000000000000000"
  eurc_address: "0xbEf5f6d51CB62b58e6A8f77868681825C6fe21c1"

swap:
  # Fund-moving swap execution is outside this mainnet release.
  strategy: "disabled"
  sidecar_socket: "/tmp/rova-swap.sock"
  router_address: ""
  slippage_bps: 50
  enable_fallback: false



