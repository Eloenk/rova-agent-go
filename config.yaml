# Rova AI & Engine Configuration

ai:
  # Provider options:
  #   "gemini"      - Primary Google Generative AI (Requires GOOGLE_GENERATIVE_AI_API_KEY)
  #   "anthropic"   - Primary Anthropic Claude (Requires ANTHROPIC_API_KEY)
  #   "agentrouter" - AgentRouter endpoint (https://agentrouter.org/, Optional AGENTROUTER_API_KEY)
  #   "auto"        - Failover: Anthropic -> Gemini -> AgentRouter
  provider: "auto"

  # Model names (leave blank for automatic provider defaults):
  #   Gemini options:      "gemini-2.0-flash", "gemini-1.5-pro"
  #   Anthropic options:   "claude-3-5-sonnet-20240620"
  #   AgentRouter options: "agent-router"
  model: "gemini-flash-latest"

  # Fallback controls:
  #   Set allow_regex_fallback to true to enable local regex intent parsing when AI APIs are rate-limited.
  #   Set to false to force PURE AI AGENT parsing ONLY.
  allow_regex_fallback: false

  # Generation settings
  temperature: 0.1
  max_tokens: 8192

database:
  # Set enabled to true if SUPABASE_URL & SUPABASE_ANON_KEY are configured in .env.local
  supabase_enabled: true

app:
  url: "https://rovapay.xyz"

vault:
  # Vault strategy options:
  #   "circle_wallet"  - Dedicated secondary Circle SCA Savings Sub-Wallet per user
  #   "smart_contract" - On-chain Timelocked Storage Vault contract (RovaSavingsVault.sol)
  strategy: "circle_wallet"

balance:
  # Balance monitoring mode:
  #   "wss" - Real-time push WebSocket log subscription (Transfer events)
  #   "rpc" - Polling via JSON-RPC with multi-endpoint failover
  mode: "wss"
  poll_interval_sec: 5

arc:
  rpc_url: "https://arc-testnet.drpc.org"
  rpc_urls:
    - "https://arc-testnet.drpc.org"
    - "https://rpc.testnet.arc.network"
  wss_urls:
    - "wss://arc-testnet.drpc.org/ws"
    - "wss://wss.testnet.arc.network"
  chain_id: 5042002
  execution_log_address: "0x58d1e3e11C7a93cb26C371B115f2710aF68d427a"
  usdc_address: "0x3600000000000000000000000000000000000000"
  eurc_address: "0x89B50855Aa3bE2F677cD6303Cec089B5F319D72a"

swap:
  # Swap strategy options:
  #   "circle_agent_stack" - Circle Agent Stack Native Swap Engine
  #   "smart_contract"     - Uniswap-style Swap Router smart contract (RovaSwapRouter.sol)
  strategy: "circle_agent_stack"
  router_address: "0x8FE6B999Dc680CcFDD5Bf7EB0974218be2542DAA"
  slippage_bps: 50
  enable_fallback: false



